# 放到 widget.llmfree.work 站点 nginx。浏览器请求：
#   https://widget.llmfree.work/iq-detection/overview
#   https://widget.llmfree.work/iq-detection/results/{id}
# 由本机 nginx 反代到同机 iqdetectd（systemd 已听 127.0.0.1:18102；
# Compose 把容器端口发布到 127.0.0.1:18102）。只放行这两条只读路径，
# /v1 管理接口不到公网。改响应字段只发 iqdetectd，不用发主站。

location ^~ /iq-detection/ {
    limit_except GET OPTIONS {
        deny all;
    }

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers * always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
    }

    proxy_pass http://127.0.0.1:18102;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers * always;
    add_header Cache-Control "no-store" always;
}
