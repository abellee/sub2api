services:
  tg-outreach:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - tg-data:/app/data
    stop_grace_period: 30s
volumes:
  tg-data:
