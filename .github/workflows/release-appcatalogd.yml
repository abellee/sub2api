name: Release appcatalogd

on:
  push:
    tags:
      - 'appcatalogd-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version, for example 0.1.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Publish appcatalogd image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version and tags
        id: meta
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/appcatalogd-v}"
          fi
          VERSION="${VERSION#v}"
          case "$VERSION" in
            ""|*[!0-9A-Za-z._-]*)
              echo "invalid version: ${VERSION}" >&2
              exit 1
              ;;
          esac
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          TAGS="ghcr.io/${OWNER}/sub2api-appcatalogd:${VERSION},ghcr.io/${OWNER}/sub2api-appcatalogd:latest"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            TAGS="${TAGS},${DOCKERHUB_USERNAME}/sub2api-appcatalogd:${VERSION},${DOCKERHUB_USERNAME}/sub2api-appcatalogd:latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          IFS=',' read -r -a tag_list <<< "$TAGS"
          for tag in "${tag_list[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile.appcatalogd \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "COMMIT=${GITHUB_SHA}" \
            --push \
            "${tag_args[@]}" \
            .
